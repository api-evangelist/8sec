description: 8SEC is a hybrid-casual and hyper-casual mobile game studio based in Lyon,
  France, founded in 2015 by serial entrepreneur and investor Jeremie Berrebi. The
  studio rapidly prototypes and ships engaging free-to-play mobile games for iOS and
  Android, with titles such as Jump Race!, Turbo Taxi, Trivia.io, Untie!, and Human
  Puzzle that have collectively driven over 50 million downloads. 8SEC positions itself
  as a full-stack studio spanning game design, development, and publishing. It is a
  portfolio company of 500 Global, surfaced into the API Evangelist network via VC
  portfolio mapping. The company operates as a game producer and does not currently
  publish a public developer API, SDK, or documentation surface.
