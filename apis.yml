name: 8sec
description: 8SEC was a hybrid-casual and hyper-casual mobile game studio based in Lyon,
  France, founded in 2015 and later opening a second office in Paris. Over a ten-year
  run it published more than 90 free-to-play mobile games for iOS and Android — Jump
  Race!, Turbo Taxi, Trivia.io, Untie! and Human Puzzle among them — collectively
  driving roughly 50 million downloads, and positioned itself as a full-stack studio
  spanning game design, development and publishing. UK publisher Kwalee invested EUR 1.5
  million in January 2024 and took over publishing duties across the entire 8SEC
  catalogue. THE STUDIO IS NOW CLOSED — the shutdown was reported in October 2025, with
  all seven staff, including cofounders Louis Croquet and Louis Giraud, seeking new roles.
  The company's own site at 8sec.games is no longer deployed — the domain resolves to
  OVHcloud shared hosting serving a "Site not installed" 404 behind a certificate that
  does not cover the hostname — and the Teamtailor careers page returns 404. 8SEC was
  surfaced into the API Evangelist network as a 500 Global portfolio lead; it never
  published a public developer API, SDK, machine-readable specification or documentation
  surface, and it no longer exists to publish one.
